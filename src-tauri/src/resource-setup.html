<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline resources</title>
  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #242229;
      color: #f6f4fa;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 650px; padding: 48px; }
    h1 { font-size: 34px; }
    p { line-height: 1.7; color: #ccc; }
    button, a {
      display: inline-block;
      padding: 14px 24px;
      border: 0;
      border-radius: 28px;
      background: #8065aa;
      color: white;
      font: 600 16px system-ui;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    progress { width: 100%; margin-top: 24px; accent-color: #a98ed2; }
    #message { white-space: pre-wrap; }
    select { padding: 10px; border: 0; border-radius: 8px; background: #35313f; color: white; }
    a { margin-left: 12px; background: #45404f; }
  </style>
</head>
<body>
  <main>
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="zh">简体中文</option>
    </select>
    <h1 id="title"></h1>
    <p id="description"></p>
    <p id="current"></p>
    <button id="import"></button>
    <a href="/index.html" id="home" hidden></a>
    <progress id="progress" hidden value="0" max="100"></progress>
    <p id="message" role="status"></p>
  </main>
  <script>
    const copy = {
      en: {
        title: 'Offline resources',
        description: 'Choose a resource ZIP to use the app offline.',
        import: 'Import resource pack',
        home: 'Back to Home',
        ready: 'Resources are ready.',
        missing: 'No resource pack imported yet.',
        working: 'Importing and verifying…',
        cancel: 'Import cancelled. Current resources unchanged.'
      },
      zh: {
        title: '离线资源',
        description: '选择资源 ZIP，导入后即可离线使用。',
        import: '导入资源包',
        home: '返回首页',
        ready: '资源已就绪。',
        missing: '尚未导入资源包。',
        working: '正在导入并校验…',
        cancel: '已取消导入，原资源未变。'
      }
    };

    let ready = false;
    const select = document.querySelector('#language');
    const language = localStorage.getItem('resources-locale')
      || localStorage.getItem('ui-language')
      || navigator.language;
    select.value = language.startsWith('zh') || language === 'CNzh' ? 'zh' : 'en';

    function render() {
      const text = copy[select.value];
      for (const id of ['title', 'description', 'import', 'home']) {
        document.getElementById(id).textContent = text[id];
      }
      document.querySelector('#current').textContent = text[ready ? 'ready' : 'missing'];
      document.querySelector('#home').hidden = !ready;
    }

    select.onchange = render;
    render();

    window.__TAURI__.core.invoke('resource_pack_status').then(value => {
      ready = value;
      render();
    });

    window.__TAURI__.event.listen('resource-import-progress', event => {
      const [done, total] = event.payload;
      document.querySelector('#progress').value = total ? 100 * done / total : 100;
    });

    document.querySelector('#import').onclick = async () => {
      const button = document.querySelector('#import');
      const progress = document.querySelector('#progress');
      const message = document.querySelector('#message');
      button.disabled = true;
      progress.hidden = false;
      progress.value = 0;
      message.textContent = copy[select.value].working;

      try {
        const imported = await window.__TAURI__.core.invoke('import_resources');
        if (imported) {
          window.location.replace(document.querySelector('#home').href);
          return;
        }
        message.textContent = copy[select.value].cancel;
      } catch (error) {
        message.textContent = String(error);
      } finally {
        button.disabled = false;
        progress.hidden = true;
      }
    };
  </script>
</body>
</html>
